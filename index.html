        // Render Page Function
        function renderTimeline() {
            const wrapper = document.getElementById('timeline-wrapper');
            const dayData = itineraryData[currentDay];

            let html = `
                <div class="glass-card rounded-2xl p-5 mb-4 border-l-4 border-rose-400 flex items-center justify-between">
                    <div>
                        <span class="text-xs font-bold text-rose-500 bg-rose-50 px-2.5 py-1 rounded-md uppercase mb-1 inline-block">${dayData.date}</span>
                        <h2 class="text-base sm:text-lg font-bold text-warmDark">${dayData.title}</h2>
                    </div>
                    <span class="hidden sm:inline-block bg-white text-gray-600 border border-gray-200 text-xs px-3 py-1.5 rounded-xl font-medium">${dayData.badge}</span>
                </div>
            `;

            const filteredItems = dayData.items.filter(item => {
                if (activeCategory === 'all') return true;
                return item.category === activeCategory;
            });

            if (filteredItems.length === 0) {
                html += `
                    <div class="text-center py-12 bg-white/50 rounded-2xl border border-dashed border-rose-200">
                        <i class="fa-solid fa-filter text-gray-300 text-3xl mb-2"></i>
                        <p class="text-xs text-gray-400">該分類在此日期無相關行程安排</p>
                    </div>
                `;
            } else {
                filteredItems.forEach((item, index) => {
                    const categoryColors = {
                        food: "bg-rose-500 text-white",
                        spot: "bg-ocean text-white",
                        shop: "bg-purple-500 text-white"
                    };
                    const categoryBadgeClass = categoryColors[item.category] || "bg-gray-500 text-white";

                    // 導航連結按鈕
                    let mapsHtml = '';
                    if (item.maps && item.maps.length > 0) {
                        mapsHtml = `
                            <div class="mt-4 pt-3 border-t border-rose-100/70 flex flex-wrap items-center gap-2">
                                <span class="text-[11px] font-bold text-gray-400 flex items-center mr-1">
                                    <i class="fa-solid fa-map-location-dot text-rose-400 mr-1.5 text-xs"></i>導航連結：
                                </span>
                                ${item.maps.map(m => `
                                    <div class="inline-flex items-center bg-white/90 border border-rose-200/80 rounded-xl px-2.5 py-1 text-xs shadow-sm">
                                        <span class="font-semibold text-warmDark mr-2 text-[11px]">${m.name}</span>
                                        <div class="flex items-center gap-1.5 border-l border-gray-200 pl-2">
                                            <a href="${m.naver}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 font-bold text-[#03C75A] hover:opacity-80 transition" title="在 Naver Map 查看店家實拍與路線">
                                                <span class="bg-[#03C75A] text-white text-[9px] font-black px-1 rounded">N</span>
                                                <span class="text-[11px]">Naver</span>
                                            </a>
                                            <span class="text-gray-300">|</span>
                                            <a href="${m.google}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 font-bold text-blue-500 hover:opacity-80 transition" title="使用 Google Maps 開啟">
                                                <i class="fa-brands fa-google text-xs text-blue-500"></i>
                                                <span class="text-[11px]">Google</span>
                                            </a>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }

                    // 實景縮圖區塊 (若 item.img 為 null 則完全不顯示圖片區塊)
                    const imageHtml = item.img ? `
                        <div class="relative w-full h-44 sm:h-56 rounded-xl overflow-hidden mb-3.5 group shadow-inner bg-rose-50/50">
                            <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" loading="lazy" onerror="this.onerror=null; this.src='${DEFAULT_FALLBACK_IMG}'">
                            <div class="absolute bottom-2.5 right-2.5 bg-black/60 backdrop-blur-sm text-white text-[10px] sm:text-xs px-2.5 py-1 rounded-lg flex items-center gap-1.5 shadow">
                                <i class="fa-solid fa-camera text-rose-300"></i>
                                <span>${item.imgLabel || item.title}</span>
                            </div>
                        </div>
                    ` : '';

                    html += `
                        <div class="glass-card rounded-2xl p-5 custom-shadow transition duration-300 hover:translate-y-[-2px] relative overflow-hidden">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                                <div class="flex items-center gap-3">
                                    <div class="${categoryBadgeClass} w-9 h-9 rounded-xl flex items-center justify-center text-sm shadow-sm flex-shrink-0">

                                        <span class="text-xs font-extrabold text-rose-400 tracking-wider">${item.time}</span>

                                    </div>
                                </div>
                                <div class="flex items-center gap-2 self-start sm:self-auto">
                                    ${item.badge ? `<span class="bg-amber-100 text-amber-700 text-[11px] font-bold px-2.5 py-0.5 rounded-full">${item.badge}</span>` : ''}
                                    <span class="bg-gray-100 text-gray-600 text-[11px] font-medium px-2 py-0.5 rounded-md">${item.tag}</span>
                                </div>
                            </div>

                            ${imageHtml}

                            <p class="text-xs sm:text-sm text-gray-600 leading-relaxed">
                                ${item.desc}
                            </p>

                            ${mapsHtml}
                        </div>
                    `;
                });
            }
            wrapper.innerHTML = html;

        // Switch Day Tabs
        function switchDay(day) {
            currentDay = day;
            document.querySelectorAll('.day-tab').forEach((tab, i) => {
                if (i + 1 === day) {
                    tab.classList.remove('opacity-70', 'bg-white');
                    tab.classList.add('bg-warmDark', 'text-white', 'shadow-md');
                    tab.querySelector('.text-rose-400').classList.replace('text-rose-400', 'text-rose-100');
                    tab.querySelector('.text-warmDark').classList.replace('text-warmDark', 'text-white');
                    tab.querySelector('.text-gray-400').classList.replace('text-gray-400', 'text-rose-100');
                } else {
                    tab.classList.add('opacity-70', 'bg-white');
                    tab.classList.remove('bg-rose-500', 'text-white', 'shadow-md');
                    const r = tab.querySelector('.text-rose-100');
                    if (r) r.classList.replace('text-rose-100', 'text-rose-400');
                    const w = tab.querySelector('.text-white');
                    if (w) w.classList.replace('text-white', 'text-warmDark');
                    const g = tab.querySelector('.text-rose-100');
                    if (g) g.classList.replace('text-rose-100', 'text-gray-400');
                }
            });
            renderTimeline();
        }

        // Category Filter
        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-warmDark', 'text-white');
                btn.classList.add('bg-white', 'text-gray-600');
            });
            const activeBtn = document.getElementById(`btn-${cat}`);
            if(activeBtn) {
                activeBtn.classList.add('bg-warmDark', 'text-white');
                activeBtn.classList.remove('bg-white', 'text-gray-600');
            }
            renderTimeline();
        }

        // Bucket List Panel Toggle
        function toggleBucketList() {
            const panel = document.getElementById('bucket-panel');
            panel.classList.toggle('hidden');
        }

        // Render Checklist
        function renderChecklist() {
            const container = document.getElementById('checklist-container');
            let html = '';
            bucketListItems.forEach(item => {
                html += `
                    <label class="flex items-center gap-2.5 p-2.5 rounded-xl bg-white/70 hover:bg-white border border-gray-100 cursor-pointer transition">
                        <input type="checkbox" id="${item.id}" onchange="updateBucketCount()" class="w-4 h-4 rounded text-rose-500 focus:ring-rose-400 border-gray-300">
                        <span id="label-${item.id}" class="text-xs sm:text-sm font-medium text-gray-700">${item.text}</span>
                    </label>
                `;
            });
            container.innerHTML = html;
        }

        // Update Checklist Count
        function updateBucketCount() {
            let count = 0;
            bucketListItems.forEach(item => {
                const cb = document.getElementById(item.id);
                const label = document.getElementById(`label-${item.id}`);
                if (cb && cb.checked) {
                    count++;
                    label.classList.add('checked-item');
                } else if (label) {
                    label.classList.remove('checked-item');
                }
            });
            document.getElementById('bucket-count').innerText = `${count}/${bucketListItems.length}`;
        }

        // Init
        window.onload = function() {
            renderChecklist();
            switchDay(1);
        };
    </script>
</body>
</html>
