<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>釜山姊妹淘 5 Days 悠閒自由行</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FFF9F5',
                        blush: '#FFECEC',
                        rose: '#FF7B9C',
                        softPink: '#FFACC7',
                        peach: '#FFB896',
                        mint: '#E4F1EE',
                        sage: '#7DAA92',
                        ocean: '#4EA8DE',
                        warmDark: '#2B2D42'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FFF9F5;
            color: #2B2D42;
        }
        .custom-shadow {
            box-shadow: 0 10px 30px -5px rgba(255, 123, 156, 0.12);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .checked-item {
            text-decoration: line-through;
            opacity: 0.5;
        }
    </style>
</head>
<body class="min-h-screen pb-12 font-sans antialiased selection:bg-softPink selection:text-white">

    <!-- Header / Hero Section -->
    <header class="relative overflow-hidden bg-gradient-to-r from-rose-100 via-pink-100 to-amber-100 pt-8 pb-12 px-4 sm:px-8 border-b border-rose-200/50">
        <div class="max-w-4xl mx-auto text-center relative z-10">
            <div class="flex items-center justify-center gap-2 mb-3 flex-wrap">
                <span class="bg-white/80 backdrop-blur text-rose-500 font-bold px-4 py-1 rounded-full text-xs sm:text-sm tracking-wider shadow-sm">
                    <i class="fa-solid fa-heart mr-1.5"></i> GIRLS' TRIP IN BUSAN
                </span>
                <span class="bg-amber-400 text-warmDark font-extrabold px-3 py-1 rounded-full text-xs shadow-sm">
                    <i class="fa-solid fa-clock mr-1"></i> 每日 11:00 AM 睡飽出發
                </span>
            </div>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-warmDark tracking-tight mb-2">
                釜山姊妹淘 5 Days 悠閒自由行
            </h1>
            <p class="text-xs sm:text-base text-gray-600 font-medium mb-4">
                2026.12.07 (日) ➔ 2026.12.11 (四) ‧ 悠閒浪漫姐妹小旅行 ✨
            </p>

            <!-- Flight Badge -->
            <div class="inline-flex flex-col sm:flex-row items-center gap-3 bg-white/90 backdrop-blur p-3 sm:px-6 rounded-2xl shadow-sm border border-rose-100 text-xs sm:text-sm">
                <div class="flex items-center gap-2 text-gray-700">
                    <span class="font-bold text-rose-500"><i class="fa-solid fa-plane-departure mr-1"></i>去程 2026/12/7</span>
                    <span>07:40 TPE ➔ 10:50 PUS</span>
                </div>
                <div class="hidden sm:block text-gray-300">|</div>
                <div class="flex items-center gap-2 text-gray-700">
                    <span class="font-bold text-ocean"><i class="fa-solid fa-plane-arrival mr-1"></i>回程 2026/12/11</span>
                    <span>19:50 PUS ➔ 21:30 TPE</span>
                </div>
            </div>
        </div>

        <!-- Decorative background shapes -->
        <div class="absolute -top-12 -left-12 w-48 h-48 bg-pink-300/20 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute top-1/2 -right-12 w-64 h-64 bg-amber-200/30 rounded-full blur-3xl pointer-events-none"></div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 -mt-6 relative z-20">

        <!-- Quick Stats & Filter Bar -->
        <div class="glass-card rounded-2xl p-4 mb-6 custom-shadow flex flex-wrap items-center justify-between gap-3">
            <!-- Filter buttons -->
            <div class="flex items-center gap-1 sm:gap-2 overflow-x-auto hide-scrollbar w-full sm:w-auto">
                <button onclick="filterCategory('all')" id="btn-all" class="category-btn active bg-warmDark text-white px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition">
                    全部行程
                </button>
                <button onclick="filterCategory('food')" id="btn-food" class="category-btn bg-white text-gray-600 hover:bg-rose-50 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition border border-gray-100">
                    <i class="fa-solid fa-utensils text-rose-400 mr-1"></i>美食吃吃 🍽️
                </button>
                <button onclick="filterCategory('spot')" id="btn-spot" class="category-btn bg-white text-gray-600 hover:bg-rose-50 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition border border-gray-100">
                    <i class="fa-solid fa-camera text-ocean mr-1"></i>拍照景點 📸
                </button>
                <button onclick="filterCategory('shop')" id="btn-shop" class="category-btn bg-white text-gray-600 hover:bg-rose-50 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition border border-gray-100">
                    <i class="fa-solid fa-bag-shopping text-purple-400 mr-1"></i>購物放鬆 🛍️
                </button>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 ml-auto">
                <button onclick="window.print()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-1">
                    <i class="fa-solid fa-print"></i>
                    <span class="hidden sm:inline">儲存為 PDF / 列印</span>
                </button>
                <button onclick="toggleBucketList()" class="bg-rose-500 hover:bg-rose-600 text-white px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-square-check"></i>
                    <span>打卡清單</span>
                    <span id="bucket-count" class="bg-white/30 text-white text-xs px-1.5 py-0.5 rounded-full font-mono">0/9</span>
                </button>
            </div>
        </div>

        <!-- Bucket List Panel (Collapsible) -->
        <div id="bucket-panel" class="hidden glass-card rounded-2xl p-5 mb-6 custom-shadow border-2 border-rose-200">
            <h3 class="text-base font-bold text-warmDark mb-3 flex items-center justify-between">
                <span><i class="fa-solid fa-star text-amber-400 mr-2"></i>釜山必訪熱門清單 (Bucket List)</span>
                <span class="text-xs text-gray-400 font-normal">點擊完成打卡</span>
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="checklist-container">
                <!-- Checklist items injected via JS -->
            </div>
        </div>

        <!-- Days Navigation Tabs (預設 Day 1 高亮為玫瑰粉) -->
        <div class="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-1">
            <button onclick="switchDay(1)" id="tab-day1" class="day-tab flex-1 min-w-[100px] text-center p-3 rounded-2xl bg-rose-500 text-white shadow-md border border-rose-100 transition duration-200">
                <div class="text-[10px] font-bold text-rose-100 uppercase tracking-wider">DAY 1</div>
                <div class="text-xs sm:text-sm font-bold text-white">2026/12/07 (日)</div>
                <div class="text-[11px] text-rose-100 mt-0.5">南浦洞 & 夜景</div>
            </button>
            <button onclick="switchDay(2)" id="tab-day2" class="day-tab flex-1 min-w-[100px] text-center p-3 rounded-2xl bg-white shadow-sm border border-rose-100 transition duration-200 opacity-70">
                <div class="text-[10px] font-bold text-rose-400 uppercase tracking-wider">DAY 2</div>
                <div class="text-xs sm:text-sm font-bold text-warmDark">2026/12/08 (一)</div>
                <div class="text-[11px] text-gray-400 mt-0.5">膠囊列車 & 甘川</div>
            </button>
            <button onclick="switchDay(3)" id="tab-day3" class="day-tab flex-1 min-w-[100px] text-center p-3 rounded-2xl bg-white shadow-sm border border-rose-100 transition duration-200 opacity-70">
                <div class="text-[10px] font-bold text-rose-400 uppercase tracking-wider">DAY 3</div>
                <div class="text-xs sm:text-sm font-bold text-warmDark">2026/12/09 (二)</div>
                <div class="text-[11px] text-gray-400 mt-0.5">Spa Land & 韓牛</div>
            </button>
            <button onclick="switchDay(4)" id="tab-day4" class="day-tab flex-1 min-w-[100px] text-center p-3 rounded-2xl bg-white shadow-sm border border-rose-100 transition duration-200 opacity-70">
                <div class="text-[10px] font-bold text-rose-400 uppercase tracking-wider">DAY 4</div>
                <div class="text-xs sm:text-sm font-bold text-warmDark">2026/12/10 (三)</div>
                <div class="text-[11px] text-gray-400 mt-0.5">西面逛街 & 拍貼</div>
            </button>
            <button onclick="switchDay(5)" id="tab-day5" class="day-tab flex-1 min-w-[100px] text-center p-3 rounded-2xl bg-white shadow-sm border border-rose-100 transition duration-200 opacity-70">
                <div class="text-[10px] font-bold text-rose-400 uppercase tracking-wider">DAY 5</div>
                <div class
